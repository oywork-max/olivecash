<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#82DC28">
  <meta name="apple-mobile-web-app-title" content="OLIVE CASH">
  <meta name="application-name" content="OLIVE CASH">
  
  <link rel="apple-touch-icon" href="icon-180.png">  
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <title>OLIVE CASH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">
    <!-- 헤더 로고 -->
    <h1 class="logo">OLIVE <span>CASH</span></h1>

    <!-- 상단 탭 버튼 -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('remit')">송금 계산기</button>
      <button class="tab-btn" onclick="switchTab('exchange')">환전 계산기</button>
    </div>

    <!-- 송금대상금액 (좌우 구조 변경) -->
    <div class="card flex-input-card">
      <div class="label">송금대상금액</div>
      <input id="remitTarget" class="target-input" type="number" placeholder="금액 입력">
    </div>

    <!-- 1. 송금 계산기 탭 -->
    <div id="tab-remit" class="tab-content active">
      <div class="card">
        <div class="grid-header remit-grid">
          <div>권종</div>
          <div></div>
          <div style="text-align: center;">수량</div>
          <div></div>
          <div style="text-align: right;">금액</div>
        </div>
        <div id="remitList"></div>

        <div class="summary-box">
          <div class="summary-row">
            <span class="summary-title">합계 금액</span>
            <span id="remitTotal" class="total-amount">0원</span>
          </div>
          <div class="summary-row">
            <span class="summary-title">차이</span>
            <span id="remitDiff" class="diff-amount">0원</span>
          </div>
          <div id="remitStatus" class="status-badge match">🟢 정확히 일치</div>
        </div>
      </div>
    </div>

    <!-- 2. 환전 계산기 탭 -->
    <div id="tab-exchange" class="tab-content">
      <div class="card">
        <div class="grid-header ex-grid">
          <div>권종</div>
          <div style="text-align: right; padding-right: 8px;">금액</div>
          <div style="text-align: right;">수량/묶음</div>
        </div>
        <div id="exchangeList"></div>

        <div class="summary-box" style="background: #f0f8e8; margin-top: 10px;">
          <div class="summary-title" style="margin-bottom: 2px;">총 환전금액</div>
          <div id="exchangeTotal" class="total-amount">0원</div>
        </div>
        <div class="notice">📸 캡쳐해서 사용하세요!</div>
      </div>
    </div>

    <!-- 공통 초기화 버튼 -->
    <div class="actions">
      <button class="btn-reset" onclick="resetCurrentTab()">🏠 초기화</button>
    </div>
  </div>

  <div id="toast">초기화되었습니다</div>

  <script src="script.js"></script>
</body>
</html>
